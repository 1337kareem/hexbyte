<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" />
    <title>Rune Gate</title>
  </head>
  <body>
    <main class="rune-page">
      <header class="brand">
        <h1>Rune Gate</h1>
        <p id="rune-title">Checking your sign-in…</p>
      </header>
      <p id="rune-status" class="rune-status" role="status"></p>
      <div class="rune-stage">
        <video id="rune-video" playsinline muted></video>
        <canvas id="rune-canvas" aria-label="Draw your rune here"></canvas>
      </div>
      <p class="rune-help">
        Pinch your thumb and index finger together to draw in the air. Let go to finish.
        No camera? Draw with your mouse or finger on the box instead.
      </p>
      <p id="rune-progress" class="rune-progress"></p>
    </main>
    <script type="module" src="/src/rune.js"></script>
  </body>
</html>
